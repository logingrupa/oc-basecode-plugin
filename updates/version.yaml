1.0.2:
  - Replace the removed October Rain Argon class with Carbon, the 1C exchange returned 500 on checkauth. Auth headers no longer written to the request log.
1.0.3:
  - A 1C order without a delivery line keeps the shipping type chosen at checkout. Every store pickup order lost its shipping type on the first status sync, because the sync looked for a delivery position in the 1C order and wrote null when none matched.
1.0.4:
  - ParseOrderItemFromOneC::formatString() declares its parameter nullable, PHP 8.4 logged a deprecation on every 1C order line.
1.0.5:
  - 1C order sync mirrors the 1C export - old_price is the 1C list price, price is the charged line total divided by quantity, and the order's promo mechanism rows are removed so nothing discounts the 1C numbers a second time. The percent-based old_price math and the discount parser are gone. New command basecode:1c.replay_orders replays the retained sale files, oldest first, optionally for one order number. First PHPUnit suite, fixture is the real 1C export of order 260907-0010.
